<!doctype html>
<!-- Dev-only responsive probe: renders any route in a true 390px viewport
     (media queries respond to the iframe), same-origin so layout is measurable. -->
<meta charset="utf-8" />
<body style="margin:0;background:#666;display:flex;justify-content:flex-start">
  <iframe id="f" style="width:390px;height:1500px;border:0;display:block;background:#fff"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('f').src = params.get('path') || '/market';
    if (params.get('h')) document.getElementById('f').style.height = params.get('h') + 'px';
    if (params.get('w')) document.getElementById('f').style.width = params.get('w') + 'px';
  </script>
</body>
