    <title>Farm to Market</title>
    <!-- The three voices of the first viewport, fetched before the CSS asks. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Cinzel-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/PublicSans-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/CourierPrime-400.woff2" />
  </head>
  <body>
    <!--
    THESIS: Farm to Market is a security-printed trade instrument — every lot a
    certificate, every payment a banknote-grade receipt. It refuses the white-card
    agri-SaaS dashboard and its dark-terminal opposite.
    OWN-WORLD: tinted banknote paper #EFEBDD under intaglio-green ink #14322B,
    bronze-gold #A87B23 value figures, oxide-red #9E3B2C stamps; engraved guilloché
    borders and rosettes as SVG line-work at frames only; Cinzel engraved capitals,
    Public Sans document text, Courier Prime serials and money; a fixed 9-step
    ink-on-paper ramp is the only neutral scale.
    STORY: a trader or desk buyer reads lots as certificates, trusts money because
    every state is a stamped seal on ruled paper, and acts without ornament in the way.
    FIRST VIEWPORT: engraved masthead plate (F2M seal, double hairline rules), filter
    ledger left, certificate cards right — photo in engraved frame, serial, grade
    seal, GH₵ in banknote numerals; primary action is the certificate's Place Bid.
    FORM: cedi security-print grammar, candidate 4 of 7, seed 222cf785; raises:
    six-pack money sweep, zone-ramp neutrals, transit-line spine.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, DESIGN.md, and every shipping raster carrying its
    provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
